name: CD

# Publishes SamSoft.Mediator.CQRS to NuGet.org on version tags / GitHub Releases.
#
# Setup (Trusted Publishing — recommended):
# 1. nuget.org → your account → Trusted Publishing → add policy:
#      Owner: hakimsameh
#      Repository: SamSoft.Mediator.CQRS
#      Workflow: cd.yml
# 2. GitHub repo → Settings → Secrets → Actions:
#      NUGET_USER = your nuget.org profile username (not email)
#
# Fallback: set NUGET_API_KEY instead; the push step uses it when OIDC login is skipped.
#
# Trigger: git tag v1.4.0 && git push origin v1.4.0
# Or: create a GitHub Release from that tag.

on:
  push:
    tags:
      - "v*.*.*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish (e.g. 1.4.0). Leave empty to use csproj Version."
        required: false
        type: string
      dry_run:
        description: "Build/test/pack only — do not push to NuGet.org"
        required: false
        type: boolean
        default: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CONFIGURATION: Release
  ARTIFACTS_PATH: ${{ github.workspace }}/artifacts

jobs:
  publish:
    name: Build, test & publish
    runs-on: ubuntu-latest
    permissions:
      contents: write   # attach nupkg to GitHub Release / create release from tag
      id-token: write   # NuGet Trusted Publishing (OIDC)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.version }}" ]]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep -oP '(?<=<Version>)[^<]+' SamSoft.Mediator.CQRS/SamSoft.Mediator.CQRS.csproj | head -1)
            VERSION="${VERSION%.0}"  # 1.4.0.0 → 1.4.0 when four-part
            # If still four-part like 1.4.0.0, trim trailing .0 once more if needed
            if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.0$ ]]; then
              VERSION="${VERSION%.0}"
            fi
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "::error::Invalid package version: $VERSION"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved package version: $VERSION"

      - name: Restore
        run: dotnet restore SamSoft.Mediator.CQRS.sln

      - name: Build
        run: >
          dotnet build SamSoft.Mediator.CQRS.sln
          --configuration ${{ env.CONFIGURATION }}
          --no-restore
          -p:Version=${{ steps.version.outputs.VERSION }}
          -p:AssemblyVersion=${{ steps.version.outputs.VERSION }}.0
          -p:FileVersion=${{ steps.version.outputs.VERSION }}.0

      - name: Test
        run: >
          dotnet test SamSoft.Mediator.CQRS.Tests/SamSoft.Mediator.CQRS.Tests.csproj
          --configuration ${{ env.CONFIGURATION }}
          --no-build
          --verbosity normal

      - name: Pack
        run: >
          dotnet pack SamSoft.Mediator.CQRS/SamSoft.Mediator.CQRS.csproj
          --configuration ${{ env.CONFIGURATION }}
          --no-build
          --output "${{ env.ARTIFACTS_PATH }}"
          -p:GeneratePackageOnBuild=false
          -p:PackageVersion=${{ steps.version.outputs.VERSION }}
          -p:Version=${{ steps.version.outputs.VERSION }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ steps.version.outputs.VERSION }}
          path: |
            ${{ env.ARTIFACTS_PATH }}/*.nupkg
            ${{ env.ARTIFACTS_PATH }}/*.snupkg
          if-no-files-found: error

      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        continue-on-error: true
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run == false }}
        shell: bash
        env:
          OIDC_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          API_KEY_SECRET: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          API_KEY="${OIDC_KEY:-}"
          if [[ -z "$API_KEY" ]]; then
            API_KEY="${API_KEY_SECRET:-}"
          fi
          if [[ -z "$API_KEY" ]]; then
            echo "::error::No NuGet credentials. Configure Trusted Publishing + NUGET_USER, or set NUGET_API_KEY."
            exit 1
          fi

          shopt -s nullglob
          packages=("${{ env.ARTIFACTS_PATH }}"/*.nupkg)
          if (( ${#packages[@]} == 0 )); then
            echo "::error::No .nupkg files found in ${{ env.ARTIFACTS_PATH }}"
            exit 1
          fi

          for package in "${packages[@]}"; do
            echo "Pushing $package"
            dotnet nuget push "$package" \
              --api-key "$API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      - name: Publish GitHub Release assets (tag push)
        if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SamSoft.Mediator.CQRS ${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          files: |
            ${{ env.ARTIFACTS_PATH }}/*.nupkg
            ${{ env.ARTIFACTS_PATH }}/*.snupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach packages to existing GitHub Release
        if: ${{ github.event_name == 'release' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for package in "${{ env.ARTIFACTS_PATH }}"/*.nupkg "${{ env.ARTIFACTS_PATH }}"/*.snupkg; do
            [[ -f "$package" ]] || continue
            gh release upload "${{ github.event.release.tag_name }}" "$package" --clobber
          done
