name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore SamSoft.Mediator.CQRS.sln

      - name: Build
        run: dotnet build SamSoft.Mediator.CQRS.sln --configuration Release --no-restore

      - name: Test (net8.0)
        run: dotnet test SamSoft.Mediator.CQRS.Tests/SamSoft.Mediator.CQRS.Tests.csproj --configuration Release --no-build --framework net8.0 --verbosity normal

      - name: Test (net9.0)
        run: dotnet test SamSoft.Mediator.CQRS.Tests/SamSoft.Mediator.CQRS.Tests.csproj --configuration Release --no-build --framework net9.0 --verbosity normal

      - name: Test (net10.0)
        run: dotnet test SamSoft.Mediator.CQRS.Tests/SamSoft.Mediator.CQRS.Tests.csproj --configuration Release --no-build --framework net10.0 --verbosity normal

      - name: Pack library
        run: dotnet pack SamSoft.Mediator.CQRS/SamSoft.Mediator.CQRS.csproj --configuration Release --output artifacts -p:GeneratePackageOnBuild=false

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ matrix.os }}
          path: artifacts/*.nupkg
          if-no-files-found: error
